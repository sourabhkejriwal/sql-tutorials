<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Tutorials — learn SQL step by step</title>
  <meta name="description" content="A free, hands-on SQL course: fundamentals, joins, CASE and subqueries, CTEs, window functions and query optimization. Run every example in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M9 11c0-2 3-3 7-3s7 1 7 3v10c0 2-3 3-7 3s-7-1-7-3z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M9 11c0 2 3 3 7 3s7-1 7-3M9 16c0 2 3 3 7 3s7-1 7-3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = localStorage.getItem('sqlt.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="brand">
        <a href="#/" class="brand-link">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </span>
          <span>
            <span class="brand-name">SQL Tutorials</span>
            <span class="brand-sub">Learn by running real queries</span>
          </span>
        </a>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search topics…" autocomplete="off" aria-label="Search topics" aria-controls="search-results">
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="overall" id="overall"></div>

      <nav class="outline" id="outline"></nav>

      <div class="side-footer">
        <a href="#/playground" class="side-link" id="playground-link">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 5h16v14H4z M8 9l3 3-3 3 M13 15h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          SQL Playground
        </a>
        <div class="side-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch light / dark">
            <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button class="text-btn" id="reset-progress" type="button">Reset progress</button>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open course menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-right" id="topbar-right"></div>
        <div class="read-progress" id="read-progress" aria-hidden="true"></div>
      </header>
      <main id="view" tabindex="-1">
        <div class="loading">Loading lessons…</div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">This course needs JavaScript to show the lessons and run queries.</p></noscript>
  <script src="assets/js/highlight.js"></script>
  <script src="assets/js/sql-runner.js"></script>
  <script src="assets/js/autocomplete.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
